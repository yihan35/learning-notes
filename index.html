<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>学习笔记｜Yihan</title>
<style>
:root{--ink:#20251f;--muted:#687168;--paper:#fbfaf6;--line:#e7e5dc;--green:#315d4b;--mint:#eaf1eb;--gold:#c28c3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
main{max-width:920px;margin:auto;padding:64px 26px 80px}.eyebrow{color:var(--green);font-size:12px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
header{position:relative;overflow:hidden;padding:54px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(120deg,#eef3ed,#f6f3e8)}
h1{margin:12px 0 8px;font-size:clamp(36px,6vw,56px);line-height:1.12;letter-spacing:-.04em}header p{max-width:570px;margin:0;color:#515e53;font-size:17px}header:after{content:"学";position:absolute;right:40px;top:10px;color:#315d4b0c;font-size:190px;font-weight:800;line-height:1}
section{margin-top:42px}h2{margin:0 0 17px;font-size:22px;letter-spacing:-.02em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
a.card{display:block;padding:22px 23px;border:1px solid var(--line);border-radius:17px;background:#fff;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s}
a.card:hover{transform:translateY(-3px);border-color:#9db4a3}.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:12px;font-weight:650}
.card h3{margin:14px 0 5px;font-size:20px}.card p{margin:0;color:var(--muted);font-size:14px}.go{display:inline-block;margin-top:17px;color:var(--green);font-size:14px;font-weight:700}
.note{padding:17px 20px;border-left:3px solid var(--gold);border-radius:0 11px 11px 0;background:#f6f2e9;color:#665738;font-size:14px}
footer{margin-top:48px;padding-top:17px;border-top:1px solid var(--line);color:#92988f;font-size:12px}
@media(max-width:600px){main{padding:24px 15px 50px}header{padding:36px 25px}header:after{right:-8px;top:25px;font-size:130px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">PERSONAL KNOWLEDGE LIBRARY</div><h1>学习笔记</h1><p>把读过、学过的内容整理成清晰易复习的笔记。新主题会持续收录在这里。</p></header>
<section><h2>英语口语</h2><div class="grid">
<a class="card" href="./my-day/"><span class="tag">实战训练 · 第一期</span><h3>My Day</h3><p>从描述一天开始练口语：今日语料、句型框架与四轮练习。</p><span class="go">打开笔记　→</span></a>
<a class="card" href="./experience-story/"><span class="tag">实战训练 · 第二期</span><h3>Experience &amp; Story</h3><p>把真实经历讲完整：从原计划、意外变化到应对、结果和回看。</p><span class="go">打开笔记　→</span></a>
</div></section>
<div class="note">后续新增笔记时，可按主题建立独立页面，并在这里添加入口。</div>
<footer>持续整理 · 持续复习</footer>
</main></body>
</html>
